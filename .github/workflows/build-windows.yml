name: Build HumanDetect Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout HumanDetect overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout upstream Web Audio Mastering v1.3.4 source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/eas4ai/Web-Audio-Mastering.git app

      - name: Verify upstream version
        shell: pwsh
        run: |
          $pkg = Get-Content app/package.json | ConvertFrom-Json
          if ($pkg.version -ne '1.3.4') { throw "Unexpected upstream version: $($pkg.version)" }

      - name: Copy HumanDetect modules
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/web/human-detect | Out-Null
          Copy-Item overlay/patch/human-detector-core.js app/web/human-detect/human-detector-core.js
          Copy-Item overlay/patch/human-detect-panel.js app/web/human-detect/human-detect-panel.js
          Copy-Item overlay/patch/humanize-boost.js app/web/human-detect/humanize-boost.js
          Copy-Item overlay/patch/virtual-performance.js app/web/human-detect/virtual-performance.js
          Copy-Item overlay/patch/auto-optimize.js app/web/human-detect/auto-optimize.js
          Copy-Item overlay/patch/stem-engine.js app/web/human-detect/stem-engine.js
          Copy-Item overlay/patch/stem-lab-panel.js app/web/human-detect/stem-lab-panel.js
          Copy-Item overlay/patch/reperformance-panel.js app/web/human-detect/reperformance-panel.js
          Copy-Item overlay/patch/instrument-manager-panel.js app/web/human-detect/instrument-manager-panel.js
          Copy-Item overlay/patch/smart-pipeline-panel.js app/web/human-detect/smart-pipeline-panel.js
          Copy-Item overlay/patch/mastering-station-panel.js app/web/human-detect/mastering-station-panel.js
          Copy-Item overlay/patch/ai-mastering-style.js app/web/human-detect/ai-mastering-style.js
          Copy-Item overlay/patch/ai-mastering-panel.js app/web/human-detect/ai-mastering-panel.js
          Copy-Item overlay/patch/external-detector-panel.js app/web/human-detect/external-detector-panel.js
          Copy-Item overlay/patch/ensemble-detector-panel.js app/web/human-detect/ensemble-detector-panel.js
          Copy-Item overlay/patch/calibration-panel.js app/web/human-detect/calibration-panel.js
          Copy-Item overlay/patch/apply_patch.py app/apply_patch.py
          Copy-Item overlay/patch/patch_v2.py app/patch_v2.py
          Copy-Item overlay/patch/patch_v21.py app/patch_v21.py
          Copy-Item overlay/patch/patch_v212.py app/patch_v212.py
          Copy-Item overlay/patch/patch_v213.py app/patch_v213.py
          Copy-Item overlay/patch/patch_v214.py app/patch_v214.py
          Copy-Item overlay/patch/patch_v215.py app/patch_v215.py
          Copy-Item overlay/patch/patch_v216.py app/patch_v216.py
          Copy-Item overlay/patch/patch_v22.py app/patch_v22.py
          Copy-Item overlay/patch/patch_v221.py app/patch_v221.py
          Copy-Item overlay/patch/patch_v222.py app/patch_v222.py
          Copy-Item overlay/patch/patch_v223.py app/patch_v223.py
          Copy-Item overlay/patch/patch_v230.py app/patch_v230.py
          Copy-Item overlay/patch/patch_v231.py app/patch_v231.py
          Copy-Item overlay/patch/patch_v232.py app/patch_v232.py
          Copy-Item overlay/patch/patch_v233.py app/patch_v233.py
          Copy-Item overlay/patch/patch_v240.py app/patch_v240.py
          Copy-Item overlay/patch/patch_v241.py app/patch_v241.py
          Copy-Item overlay/patch/patch_v250.py app/patch_v250.py
          Copy-Item overlay/patch/patch_v251.py app/patch_v251.py
          Copy-Item overlay/patch/patch_v260.py app/patch_v260.py
          Copy-Item overlay/patch/patch_v261.py app/patch_v261.py
          Copy-Item overlay/patch/patch_v270.py app/patch_v270.py
          Copy-Item overlay/patch/patch_v280.py app/patch_v280.py
          Copy-Item overlay/patch/patch_v290.py app/patch_v290.py
          Copy-Item overlay/patch/patch_v300.py app/patch_v300.py
          Copy-Item overlay/patch/patch_v310.py app/patch_v310.py

      - name: Apply integration patches
        working-directory: app
        run: |
          python apply_patch.py
          python patch_v2.py
          python patch_v21.py
          python patch_v212.py
          python patch_v213.py
          python patch_v214.py
          python patch_v215.py
          python patch_v216.py
          python patch_v22.py
          python patch_v221.py
          python patch_v222.py
          python patch_v223.py
          python patch_v230.py
          python patch_v231.py
          python patch_v232.py
          python patch_v233.py
          python patch_v240.py
          python patch_v241.py
          python patch_v250.py
          python patch_v251.py
          python patch_v260.py
          python patch_v261.py
          python patch_v270.py
          python patch_v280.py
          python patch_v290.py
          python patch_v300.py
          python patch_v310.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build portable Windows EXE
        working-directory: app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem app/release -Recurse | Select-Object FullName,Length

      - name: Publish portable EXE to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3.1.0"
          $exe = Get-ChildItem app/release/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE not found" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "HumanDetect v3.1.0" --notes "Portable Windows build for HumanDetect v3.1.0 Instrument Cloud Catalog."
          }
          gh release upload $tag "$($exe.FullName)#HumanDetect_3.1.0.exe" --clobber
